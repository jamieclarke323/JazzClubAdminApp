{% comment %}
Reusable category manager: add/rename/delete household categories.
Expects: categories
{% endcomment %}
<details class="category-manager">
  <summary class="secondary-button small">Manage categories</summary>
  <div class="category-manager-panel">
    <form method="post" action="{% url 'category_create' %}" class="shopping-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <input type="text" name="name" placeholder="New category" required>
      <button type="submit" class="primary-button small">Add</button>
    </form>
    <ul class="category-manage-list">
      {% for category in categories %}
      <li class="category-manage-row">
        <form method="post" action="{% url 'category_update' category.id %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <input type="text" name="name" value="{{ category.name }}">
          <button type="submit" class="ghost-button small">Save</button>
        </form>
        <form method="post" action="{% url 'category_delete' category.id %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button type="submit" class="icon-button" aria-label="Delete category">×</button>
        </form>
      </li>
      {% empty %}
      <li class="muted">No categories yet.</li>
      {% endfor %}
    </ul>
  </div>
</details>
